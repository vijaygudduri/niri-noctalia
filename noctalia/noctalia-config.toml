[bar.default]
background_opacity = 0.79999998211860657
capsule = true
capsule_fill = "#1E1F27"
center = [ "battery", "date", "clock" ]
end = [ "group:g1", "network", "group:g2", "notifications" ]
margin_edge = 0
margin_ends = 0
scale = 1.1000000000000001
start = [ "privacy", "volume", "brightness", "taskbar", "tray" ]
thickness = 39

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center audio"
    middle = "panel-toggle control-center home"
    right = "panel-toggle control-center monitor"

    [[bar.default.capsule_group]]
    enabled = true
    fill = "#1E1F27"
    id = "g1"
    members = [ "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 8.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "#1E1F27"
    id = "g2"
    members = [ "bluetooth", "battery_3" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 0

[calendar]
enabled = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

[location]
address = "Bayyaram, india"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 103.0
    box_width = 400.0
    cx = 960.0
    cy = 600.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.65000000000000002
        background_radius = 32.0
        center_password_text = true
        input_opacity = 0.5
        input_radius = 32.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 64.0
    box_width = 192.0
    cx = 960.0
    cy = 376.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.59999999999999998
        background_padding = 0
        background_radius = 32
        center_text = false
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 112.0
    cx = 960.0
    cy = 1144.0
    output = "eDP-1"
    rotation = 0.0
    type = "button"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        command = "systemctl suspend"
        glyph = "moon-stars"
        label = "Suspend"
        variant = "default"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 192.0
    box_width = 240.0
    cx = 960.0
    cy = 248.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background_opacity = 0.5
        background_padding = 0
        background_radius = 32
        clock_style = "analog"

[nightlight]
enabled = true
temperature_night = 5500

[notification]
layer = "overlay"

[osd]
position = "top_center"

    [osd.kinds]
    media = false

[plugin_settings."noctalia/screen_recorder"]
video_source = "focused"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
avatar_path = "/home/vijay/Pictures/Wallpapers/Avtars/wallhaven-jevz8y_1600x1200.png"
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    control_center_placement = "attached"
    open_near_click_control_center = true
    open_near_click_launcher = true
    transparency_mode = "soft"

[theme]
